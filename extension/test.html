<!doctype html>
<meta charset="utf-8">
<title>FinPilot engine tests</title>
<style>body{font:14px system-ui;margin:20px} .ok{color:#15803d} .bad{color:#b91c1c} pre{white-space:pre-wrap}</style>
<h1>FinPilot engine tests (JS vs Python), v4</h1>
<div id="out">running…</div>
<script type="module">
import { loadModels } from "./lib/ml.js";
import { FORECAST_CATEGORIES, features, vector } from "./lib/features.js";
import { familyState, monthlyFreeCash, planGoals, upcomingRecurring, usualP90, yearlyIncome } from "./lib/finance.js";

const results = [];
const check = (name, ok, detail = "") => results.push({ name, ok, detail });
const close = (a, b, tol) => Math.abs(a - b) <= tol;

const m = await loadModels("./");

// Task 1: models
check("categorizer labels", m.tests.categorizer.every((t) => m.categorizer.predict(t.text) === t.expected));
check("intent labels", m.tests.intent.every((t) => m.intent.predict(t.text) === t.expected));
check("price predictions", m.tests.price.every((t) => close(Math.exp(m.price.predict(t.text)), t.expected, 0.02)));
check("overspend probabilities", m.tests.overspend.every((t) => close(m.overspend.proba(t.x), t.expected, 1e-4)));
check("recurring probabilities", m.tests.recurring.every((t) => close(m.recurring.proba(t.x), t.expected, 1e-4)));

// Task 2: live features and money math on the demo family (fixture computed by the Python backend)
const fx = await (await fetch("./data/test_fixture.json")).json();
const tx = fx.transactions;
check("yearly income", close(yearlyIncome(tx, fx.today), fx.yearly_income, 0.01), `${yearlyIncome(tx, fx.today)} vs ${fx.yearly_income}`);
const state = familyState(tx, 2, fx.today);
const names = m.overspendSpec.features;
for (const c of FORECAST_CATEGORIES) {
  const row = features(state, c, fx.today);
  const exp = fx.features[c];
  if (!exp) { check(`features ${c}`, row === null, "expected no history"); continue; }
  const x = vector(row, names);
  const bad = names.filter((f, i) => !close(x[i], exp.x[i], 1e-3 * Math.max(1, Math.abs(exp.x[i]))));
  check(`features ${c}`, bad.length === 0, bad.map((f) => `${f}: ${x[names.indexOf(f)]} vs ${exp.x[names.indexOf(f)]}`).join("; "));
  check(`risk ${c}`, close(m.overspend.proba(x), exp.prob, 1e-3), `${m.overspend.proba(x).toFixed(4)} vs ${exp.prob}`);
}
const free = monthlyFreeCash(tx, fx.today);
check("free cash", close(free, fx.free_cash, 0.01), `${free} vs ${fx.free_cash}`);
const up = upcomingRecurring(m, tx, fx.today, 30).map((u) => `${u.date}|${u.amount.toFixed(2)}|${u.category}`).sort();
const upExp = fx.upcoming.map((u) => `${u.date}|${Number(u.amount).toFixed(2)}|${u.category}`).sort();
check("upcoming payments", JSON.stringify(up) === JSON.stringify(upExp), `JS ${up.length}, Python ${upExp.length}; only JS: ${up.filter((x) => !upExp.includes(x)).join(", ")}; only Py: ${upExp.filter((x) => !up.includes(x)).join(", ")}`);
const demoGoals = [{ name: "Kids' college fund", target: 40000, saved: 6000, deadline: "2030-09-01" },
  { name: "Family car", target: 12000, saved: 2500, deadline: "2027-12-01" }];
const goals = planGoals(demoGoals, free, fx.today);
const gExp = fx.goals;
check("goal plans", goals.every((g) => { const e = gExp.find((x) => x.name === g.name); return e && close(g.needed_per_month, e.needed_per_month, 0.01) && close(g.allocated_per_month, e.allocated_per_month, 0.05) && g.projected_date === e.projected_date && g.on_track === e.on_track; }),
  JSON.stringify(goals.map((g) => [g.name, g.needed_per_month, g.allocated_per_month, g.projected_date, g.on_track])));
check("usual price (shopping p90)", close(usualP90(tx, "shopping", fx.today), fx.usual_p90_shopping, 0.01), `${usualP90(tx, "shopping", fx.today)} vs ${fx.usual_p90_shopping}`);

// Task 13: family password store and demo family
const { Store, DEMO_PASSWORD, validPassword, generatePassword, normalizePassword } = await import("./lib/store.js");
check("password rules", validPassword("DEMO26") && validPassword("7K2PQ9") && !validPassword("ABCDEF") && !validPassword("123456") && !validPassword("AB12C") && !validPassword("AB-123"));
check("generated passwords valid", Array.from({ length: 50 }, generatePassword).every(validPassword));
const demo = await (await fetch("./data/demo_family.json")).json();
const store = new Store(m);
const t0 = performance.now();
await store.loadDemo(demo, "2026-11-15");
const ms = performance.now() - t0;
check("demo loads under 3 s", ms < 3000, `${ms.toFixed(0)} ms`);
check("demo family: 2 children, no profiles", store.data.family.children === 2 && !("members" in store.data.family) && store.data.family.is_demo);
check("no transactions after today", store.data.transactions.every((t) => t.date <= "2026-11-15"));
check("every transaction categorized", store.data.transactions.every((t) => t.category));
check("seed correction applied", store.data.transactions.filter((t) => t.description === "PURCHASE INTEREST CHARGE").every((t) => t.category === "fees"));
const demoCount = store.data.transactions.length;
const resumed = new Store(m);
check("panel re-opens the unlocked family", (await resumed.resume()) && resumed.data.transactions.length === demoCount);
await store.lock();
check("lock forgets the family", !store.ready && !(await new Store(m).resume()));
let wrong = false; try { await store.unlock("ZZZ999"); } catch (e) { wrong = true; }
check("wrong password rejected", wrong && !store.ready);
await store.unlock(" demo26 ");
check("password is case-insensitive", store.ready && store.data.transactions.length === demoCount);
let dup = false; try { await store.createFamily("Copycats", DEMO_PASSWORD); } catch (e) { dup = e.message.includes("already used"); }
check("password already used is rejected", dup);
let weak = false; try { await store.createFamily("Weak", "abcdef"); } catch (e) { weak = true; }
check("weak password rejected", weak);
const pw = generatePassword();
await store.createFamily("The Smiths", pw, 1);
check("new family starts empty", store.data.transactions.length === 0 && store.data.family.name === "The Smiths");
await store.addEntry({ kind: "expense", amount: 23.4, description: "Starbucks latte" });
await store.addEntry({ kind: "income", amount: "1500", description: "Salary ACME payroll" });
const [e1, e2] = store.data.transactions;
check("expense saved negative, category by ML", e1.amount === -23.4 && e1.category === "dining" && e1.category_source === "model", JSON.stringify(e1));
check("income saved positive", e2.amount === 1500 && e2.category === "income", JSON.stringify(e2));
const [salary, refund, sold] = store.categorize([{ amount: 1200, description: "PAYPAL *Salary", source: "paypal" },
  { amount: 25, description: "PAYPAL *Refund Nike shoes", source: "paypal" }, { amount: 80, description: "Sold old bike on eBay", channel: "manual" }]);
check("money in from PayPal or marked as income counts as income (refunds left to the model)",
  salary.category === "income" && sold.category === "income" && refund.category === m.categorizer.predict("[credit] PAYPAL *Refund Nike shoes") && refund.category_source === "model",
  `${salary.category} ${sold.category} ${refund.category}`);
let noAmount = false; try { await store.addEntry({ kind: "expense", amount: 0, description: "x" }); } catch (e) { noAmount = true; }
check("zero amount rejected", noAmount);
await store.lock(); await store.unlock(normalizePassword(pw));
check("each family sees only its own money", store.data.transactions.length === 2);
await store.deleteFamily();
await store.unlock(DEMO_PASSWORD);
const fixTx = store.data.transactions.find((t) => /T-?MOBILE/i.test(t.description) && t.category_source === "model");
const n = fixTx ? await store.fixCategory(fixTx.id, "utilities") : -1;
check("category fix updates same merchant", n > 0, `updated ${n}`);

// Task 12: market price from the database (kNN)
const { MarketIndex } = await import("./lib/market.js");
const t1 = performance.now();
const indexSpec = await (await fetch("./models/price_index.json")).json();
const market = new MarketIndex(indexSpec);
check("market index builds under 4 s", performance.now() - t1 < 4000, `${(performance.now() - t1).toFixed(0)} ms`);
const mBad = indexSpec.tests.filter((t) => { const r = market.lookup(t.title); return !r || Math.abs(r.median - t.expected) > 0.01; })
  .map((t) => `${t.title.slice(0, 40)}: ${market.lookup(t.title)?.median} vs ${t.expected}`);
check("market median matches Python", mBad.length === 0, mBad.join("; "));

// Task 5/16: verdict rules and full check on the demo family
const { decide, checkPurchase } = await import("./lib/verdict.js");
const cases = await (await fetch("./data/verdict_cases.json")).json();
const badCases = cases.filter((c) => { const v = decide(c.in); return v.decision !== c.decision || v.reasons.length !== c.n_reasons; });
check(`verdict rules (${cases.length} cases)`, badCases.length === 0, JSON.stringify(badCases.slice(0, 3)));
const app = { models: m, market, store, today: "2026-11-15" };
const concert = checkPurchase(app, { title: "Concert tickets", price: 100, url: "https://www.ticketmaster.com/e/1" });
check("concert $100 -> not worth it with a fair price", concert.decision === "not_worth_it" && concert.reasonable_price > 10 && concert.reasonable_price < 60,
  `${concert.decision} fair ${concert.reasonable_price} reasons ${concert.reasons.join(" | ")}`);
check("verdict tells what is left this month", concert.left_this_month != null && concert.days_left === 15, `${concert.left_this_month} ${concert.days_left}`);
const phones = checkPurchase(app, { title: "Sony WH-1000XM5 Wireless Noise Canceling Headphones", price: 348, url: "https://www.amazon.com/dp/x" });
check("headphones $348 -> not worth it, market price shown", phones.decision === "not_worth_it" && phones.market?.median > 0 && phones.market.similar.length > 0,
  `${phones.decision} ${JSON.stringify(phones.market)}`);
const pods = checkPurchase(app, { title: "Apple AirPods Pro (2nd generation) wireless earbuds", price: 249, url: "https://www.amazon.com/dp/z" });
check("accessory-priced neighbours -> no market price shown", pods.market === null && pods.market_unclear && pods.explain.market.average === null, JSON.stringify(pods.market_unclear));
check("explanation is consistent (no 'left' + 'no room' clash)", !(concert.explain.family.includes(" left ") && /no room/i.test(concert.explain.fair || "")), JSON.stringify(concert.explain));
const calc = checkPurchase(app, { title: "TI-84 Plus graphing calculator for school", price: 129, url: "https://www.amazon.com/dp/y" });
check("school calculator judged as a need", calc.kind === "need" && calc.risk_after === null, `${calc.kind} ${calc.decision}`);

// Task 14: built-in advisor, no external AI
const { answer, answerTopic, TOPICS } = await import("./lib/assistant.js");
const topicErrors = Object.keys(TOPICS).filter((t) => { try { return !answerTopic(app, t).reply; } catch (e) { return true; } });
check("every advisor topic answers", topicErrors.length === 0, topicErrors.join(", "));
const a1 = answer(app, "how much did we spend on restaurants last month?");
check("question -> spending answer", a1.topic === "spending" && a1.reply.includes("Dining"), JSON.stringify(a1));
const a2 = answer(app, "can I buy concert tickets for $100?");
check("question -> purchase verdict", a2.topic === "can_afford" && a2.reply.startsWith("Not worth it"), JSON.stringify(a2));
const a4 = answer(app, "what can i buy");
check("'what can i buy' -> safe amounts from the overspend model", a4.topic === "can_spend" && a4.reply.startsWith("Safe to spend") && /up to \$\d/.test(a4.reply), a4.reply);
const a5 = answerTopic(app, "can_spend", "what's safe to spend on clothes right now");
check("safe amount for one category (clothes -> Shopping)", a5.reply.startsWith("Shopping:"), a5.reply);
const a6 = answer(app, "can i buy a laptop?");
check("no price given -> price from our market database, then the verdict", a6.topic === "can_afford" && a6.reply.includes("average for") && /Worth it|Think about it|Not worth it/.test(a6.reply), a6.reply);
const a7 = answer(app, "thinking of getting airpods for 249, good idea?");
check("price written without $ is understood (not asked, not estimated)", a7.topic === "can_afford" && !a7.reply.includes("Tell me the price") && !a7.reply.includes("average for") && /Worth it|Think about it|Not worth it/.test(a7.reply), a7.reply);
const a3 = answer(app, "hmm");
check("unsure -> offers other topics", a3.alternatives.length === 2 && a3.confidence < 0.6, JSON.stringify(a3));

// PayPal: Log in with PayPal (user's own account) + payments through our Sandbox shop
const pp = await import("./lib/paypal.js");
const au = new URL(pp.authorizeUrl("CID", "https://lakkaedhdeopfgfnpioemhplfomfgbam.chromiumapp.org/paypal", "S1"));
check("PayPal login URL", au.origin === "https://www.sandbox.paypal.com" && au.searchParams.get("response_type") === "code" && au.searchParams.get("scope").includes("email") && au.searchParams.get("state") === "S1");
check("PayPal answer: code read, wrong state rejected, cancel explained",
  pp.readRedirect("https://x.chromiumapp.org/paypal?code=ABC&state=S1", "S1") === "ABC"
  && (() => { try { pp.readRedirect("https://x.chromiumapp.org/paypal?code=ABC&state=EVIL", "S1"); return false; } catch { return true; } })()
  && (() => { try { pp.readRedirect("https://x.chromiumapp.org/paypal?error=access_denied&state=S1", "S1"); return false; } catch (e) { return e.message.includes("cancelled"); } })());
const who = pp.profileOf({ name: "Jane Carter", emails: [{ value: "Jane@Example.com", primary: true }], payer_id: "P1" });
check("PayPal profile", who.name === "Jane Carter" && who.email === "jane@example.com" && who.payer_id === "P1");
const shop = [
  { transaction_info: { transaction_id: "T1", transaction_initiation_date: "2026-11-10T10:00:00+0000", transaction_amount: { value: "42.50" }, transaction_note: "Trader Joe's groceries" }, payer_info: { email_address: "jane@example.com" } },
  { transaction_info: { transaction_id: "T2", transaction_initiation_date: "2026-11-11T10:00:00+0000", transaction_amount: { value: "99.00" } }, payer_info: { email_address: "someone@else.com" } },
  { transaction_info: { transaction_id: "T3", transaction_initiation_date: "2026-11-12T10:00:00+0000", transaction_amount: { value: "-10.00" }, transaction_subject: "Refund" }, payer_info: { account_id: "P1" } },
];
const fam = pp.familyPayments(shop, who);
check("PayPal import: only this person's payments, spending negative, refunds positive",
  fam.length === 2 && fam[0].amount === -42.5 && fam[0].description === "PAYPAL *Trader Joe's groceries" && fam[1].amount === 10 && fam[0].date === "2026-11-10", JSON.stringify(fam));

const jwt = "x." + btoa(JSON.stringify({ sub: "u1", name: "Jane Carter", email: "Jane@Example.com", payer_id: "P1" })).replace(/=+$/, "").replace(/\+/g, "-").replace(/\//g, "_") + ".sig";
const fromToken = pp.profileOf(pp.decodeJwt(jwt));
check("PayPal profile from the login id_token", fromToken.email === "jane@example.com" && fromToken.name === "Jane Carter" && pp.decodeJwt("garbage") === null, JSON.stringify(fromToken));
const own = pp.ownPayments(shop);
check("PayPal import when the shop account itself is connected: whole history, signs as they are", own.length === 3 && own[0].amount === 42.5 && own[2].amount === -10, JSON.stringify(own));

// Money: monthly income added by itself, possible duplicates after a PayPal import, history sort and filter
const { historyView } = await import("./views/money.js");
await store.lock();
await store.createFamily("The Lees", generatePassword(), 0);
const addedPay = await store.addIncome({ name: "Salary ACME", amount: 3000, day: 31, since: "2026-08" }, "2026-11-16");
const payDates = store.data.transactions.map((t) => t.date).join(",");
check("monthly income: missed months are added, day 31 falls on the month's last day, a pay day still ahead waits",
  addedPay === 3 && payDates === "2026-08-31,2026-09-30,2026-10-31" && store.data.transactions.every((t) => t.amount === 3000 && t.category === "income" && t.source === "salary"), `${addedPay} ${payDates}`);
const again = await store.applyRecurringIncome("2026-11-16"), later = await store.applyRecurringIncome("2026-12-01");
check("monthly income is never added twice; the next month arrives on its pay day", again === 0 && later === 1 && store.data.transactions.at(-1).date === "2026-11-30", `${again} ${later}`);
await store.deleteTransaction(store.data.transactions.find((t) => t.date === "2026-10-31").id);
check("a deleted monthly payment does not come back", (await store.applyRecurringIncome("2026-12-01")) === 0 && store.data.transactions.length === 3);
const job2 = await store.addIncome({ name: "Tutoring", amount: 400, day: 5 }, "2026-12-10");
check("a second job is added next to the first", job2 === 1 && store.incomes().length === 2 && store.data.transactions.at(-1).date === "2026-12-05", String(job2));
let badPay = 0; for (const f of [{ name: "", amount: 5, day: 1 }, { name: "x", amount: 0, day: 1 }, { name: "x", amount: 5, day: 40 }]) { try { await store.addIncome(f, "2026-12-10"); } catch (e) { badPay++; } }
check("monthly income needs a name, an amount and a real day", badPay === 3 && store.incomes().length === 2);
await store.addEntry({ kind: "expense", amount: 15, description: "Coffee with Sam", date: "2026-12-08" });
await store.addTransactions([{ id: "pp-D1", date: "2026-12-04", amount: 400, description: "PAYPAL *Tutoring", channel: "online" },
  { id: "pp-D2", date: "2026-12-09", amount: -15, description: "PAYPAL *Cafe", channel: "online" },
  { id: "pp-D3", date: "2026-12-09", amount: -62.1, description: "PAYPAL *Shoes", channel: "online" }], "paypal");
const dups = store.duplicates();
check("PayPal import: same amount within 3 days of an entry already there is flagged, nothing is deleted",
  dups.length === 2 && dups[0].entry.id === "pp-D1" && !!dups[0].twin.income_id && dups[1].entry.id === "pp-D2" && store.data.transactions.length === 8, JSON.stringify(dups.map((d) => [d.entry.id, d.twin.id])));
check("history filter: only possible duplicates", historyView(store.data.transactions, { dup: true }).length === 2);
const gone = await store.resolveDuplicate("pp-D1", true);
check("'Yes, the same': one entry stays (PayPal's, as income) and the monthly income does not add it again",
  gone?.source === "salary" && store.data.transactions.filter((t) => t.amount === 400).length === 1 && store.data.transactions.find((t) => t.id === "pp-D1").category === "income"
  && (await store.applyRecurringIncome("2026-12-10")) === 0, JSON.stringify(gone));
const kept = await store.resolveDuplicate("pp-D2", false);
check("'No, different': both entries stay and the question is not asked again", kept === null && store.duplicates().length === 0 && store.data.transactions.filter((t) => t.amount === -15).length === 2
  && (await store.addTransactions([{ id: "pp-D2", date: "2026-12-09", amount: -15, description: "PAYPAL *Cafe" }], "paypal")) === 0);
const hv = (st) => historyView(store.data.transactions, st);
const sorted = (list, f) => list.every((t, i) => i === 0 || f(list[i - 1], t));
check("history sort: newest or oldest first", sorted(hv({ sort: "date", dir: "desc" }), (a, b) => a.date >= b.date) && sorted(hv({ sort: "date", dir: "asc" }), (a, b) => a.date <= b.date) && hv({}).length === 7);
check("history sort: by amount, either way", hv({ sort: "amount", dir: "desc" })[0].amount === 3000 && Math.abs(hv({ sort: "amount", dir: "asc" })[0].amount) === 15);
check("history sort: by type (income first or expenses first)", hv({ sort: "type", dir: "desc" })[0].amount > 0 && hv({ sort: "type", dir: "asc" })[0].amount < 0
  && sorted(hv({ sort: "type", dir: "desc" }), (a, b) => (a.amount > 0) >= (b.amount > 0)));
check("history filter: money in, money out, category, search", hv({ type: "in" }).every((t) => t.amount > 0) && hv({ type: "in" }).length === 4 && hv({ type: "out" }).length === 3
  && hv({ cat: "income" }).length === 4 && hv({ q: "shoes" }).length === 1 && hv({ q: "income", type: "out" }).length === 0);
await store.deleteFamily();

const failed = results.filter((r) => !r.ok);
document.getElementById("out").innerHTML = `<p class="${failed.length ? "bad" : "ok"}"><b>${results.length - failed.length}/${results.length} passed</b></p>` +
  results.map((r) => `<div class="${r.ok ? "ok" : "bad"}">${r.ok ? "✓" : "✗"} ${r.name}${r.ok ? "" : `<pre>${r.detail}</pre>`}</div>`).join("");
window.RESULTS = results;
</script>
